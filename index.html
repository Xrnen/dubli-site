<style>
/* Self-hosted, so the page makes no external request. Font: IBM Plex Sans Arabic (OFL) — the app's own font. */
@font-face{
  font-family:'Plex Arabic';
  src:url('assets/IBMPlexSansArabic-Medium.ttf') format('truetype');
  font-weight:400 700;font-style:normal;font-display:swap;
}
/* Layout concept: one calm RTL-first column. Sticky glass header, hero with a before/after game scene (an
   illustration), principles, status-labelled features, real app screenshots, a method comparison, a safety section
   with a verify-your-download box, a download card that stays honest until a real release is configured, FAQ.
   No glowing orbs (the owner dislikes them). Colours and palettes mirror the app (Services/Palettes.cs). */
:root{
  --font-display:'Plex Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --font-body:'Plex Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --font-mono:ui-monospace,'Cascadia Mono',Consolas,monospace;
  --bg:#F5F5FB; --bg2:#EBEBF6; --card:#FFFFFF; --fg:#0E1020; --muted:#4F5270; --line:#E3E3F1;
  --a1:#7C5CFF; --a2:#22D3EE; --on-a:#FFFFFF;
  --shadow:0 24px 50px -26px rgba(22,16,60,.42);
  --ok:#16A34A; --beta:#D97706; --dev:#64748B;
  --scene-1:#0B0B16; --scene-2:#1C1536; --scene-fg:#F3EEFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0912; --bg2:#141124; --card:#211D33; --fg:#FFFFFF; --muted:#AEA9CC; --line:rgba(255,255,255,.13);
    --shadow:0 28px 64px -24px rgba(0,0,0,.85); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0912; --bg2:#141124; --card:#211D33; --fg:#FFFFFF; --muted:#AEA9CC; --line:rgba(255,255,255,.13);
  --shadow:0 28px 64px -24px rgba(0,0,0,.85); color-scheme:dark;
}
/* Strong, vivid palettes (the owner wanted bold, not washed-out) — switchable; white text reads on each accent. */
:root[data-pal="violet"]{--a1:#7C5CFF;--a2:#22D3EE}
:root[data-pal="blue"]{--a1:#2563EB;--a2:#06B6D4}
:root[data-pal="pink"]{--a1:#DB2777;--a2:#F472B6}
:root[data-pal="emerald"]{--a1:#059669;--a2:#34D399}
:root[data-pal="rose"]{--a1:#E11D48;--a2:#FB7185}
:root[data-pal="amber"]{--a1:#D97706;--a2:#FBBF24}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font-body);font-size:16px;line-height:1.7;color:var(--fg);
  background:color-mix(in srgb,var(--a1) 6%,var(--bg));-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;
  background:color-mix(in srgb,var(--a1) 6%,var(--bg))}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--fg) 70%,var(--a1));outline-offset:3px;border-radius:8px}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1160px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;
  background:color-mix(in srgb,var(--bg) 80%,transparent);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
  border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:1.5rem;line-height:1}
.brand img{width:40px;height:40px;border-radius:11px}
.links{display:flex;gap:2px;margin-inline-start:14px}
.links a{padding:7px 13px;border-radius:999px;text-decoration:none;color:var(--muted);font-size:.95rem;font-weight:500;transition:background .2s,color .2s}
.links a:hover,.links a.on{color:var(--fg);background:color-mix(in srgb,var(--a1) 28%,transparent)}
.tools{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.pal{display:flex;gap:6px;align-items:center}
.pb{width:24px;height:24px;border-radius:50%;border:2px solid var(--card);padding:0;cursor:pointer;
  background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 0 0 1px var(--line)}
.pb[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.ib{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;padding:0 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;font:600 .9rem var(--font-body)}
.ib:hover{background:color-mix(in srgb,var(--a1) 25%,var(--card))}
.menu-btn{display:none}
.mob{border-top:1px solid var(--line)}
.mob nav{display:flex;flex-direction:column;padding-block:10px}
.mob nav a{padding:12px 6px;text-decoration:none;font-weight:500;border-bottom:1px solid var(--line)}
.mob-row{display:flex;align-items:center;gap:14px;padding-block:14px;color:var(--muted);font-size:.92rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 22px;border-radius:14px;
  font:600 1rem var(--font-body);text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .2s,background .2s}
.btn-p{background:linear-gradient(135deg,var(--a1),color-mix(in srgb,var(--a1) 72%,#000));color:var(--on-a);
  box-shadow:0 16px 34px -14px color-mix(in srgb,var(--a1) 75%,transparent),inset 0 1px 0 rgba(255,255,255,.22)}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 20px 40px -14px color-mix(in srgb,var(--a1) 85%,transparent),inset 0 1px 0 rgba(255,255,255,.22)}
.btn-g{background:transparent;color:var(--fg);border-color:var(--line)}
.btn-g:hover{background:color-mix(in srgb,var(--a1) 20%,transparent)}
.btn.is-off{background:transparent;color:var(--muted);border:1px dashed color-mix(in srgb,var(--muted) 60%,transparent);box-shadow:none;cursor:not-allowed}
.btn.is-off:hover{transform:none}

/* hero */
.hero{padding-block:clamp(32px,5vw,64px) clamp(28px,4vw,52px)}
.hero .wrap{display:grid;grid-template-columns:1.02fr .98fr;gap:clamp(28px,5vw,64px);align-items:center}
.hero .wrap>*{min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:9px;padding:7px 16px;border-radius:999px;
  font-size:.9rem;font-weight:700;color:var(--fg);border:1px solid color-mix(in srgb,var(--a1) 45%,var(--line));
  background:color-mix(in srgb,var(--a1) 13%,transparent)}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--a1);box-shadow:0 0 10px var(--a1)}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(2.4rem,4.6vw,3.6rem);line-height:1.12;letter-spacing:-.015em;margin:14px 0 16px;text-wrap:balance}
.hl{background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;padding-inline:.05em}
.lead{font-size:1.06rem;color:var(--muted);max-width:34em}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.meta{margin-top:16px;font-size:.9rem;color:var(--muted)}

/* scene (illustration) */
.scene{border-radius:26px;border:1px solid var(--line);box-shadow:var(--shadow);padding:10px;
  background:color-mix(in srgb,var(--card) 92%,transparent)}
.scene-screen{position:relative;aspect-ratio:16/11;border-radius:18px;overflow:hidden;color:var(--scene-fg);
  background:linear-gradient(165deg,var(--scene-1),var(--scene-2) 72%,#4A3B3D)}
.scene-screen::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.45))}
.door{position:absolute;right:13%;top:12%;width:22%;height:56%;background:linear-gradient(#0C1017,#161B24);
  border:3px solid rgba(255,255,255,.07);border-radius:3px}
.door::after{content:"";position:absolute;left:-3px;right:-3px;bottom:-3px;height:3px;background:rgba(255,226,170,.5)}
.floor{position:absolute;left:0;right:0;top:68%;bottom:0;background:linear-gradient(rgba(255,255,255,.04),rgba(0,0,0,.25))}
.ill{position:absolute;z-index:3;top:10px;right:10px;padding:3px 10px;border-radius:999px;font-size:.72rem;
  background:rgba(255,255,255,.14);color:var(--scene-fg)}
.menu{position:absolute;z-index:2;left:6%;top:12%;width:44%;display:flex;flex-direction:column;gap:9px}
.menu li{padding:8px 14px;border:1px solid rgba(255,255,255,.2);border-radius:6px;background:rgba(10,12,18,.5);
  font-size:clamp(.8rem,1.7vw,1rem)}
.dlg{position:absolute;z-index:2;left:5%;right:5%;bottom:6%;padding:12px 16px;border-radius:8px;
  background:rgba(8,10,16,.66);font-size:clamp(.84rem,1.8vw,1.05rem)}
.tx{display:grid}
.tx>span{grid-area:1/1;transition:opacity .55s}
.tx .en{direction:ltr;text-align:left}
.tx .ar{direction:rtl;text-align:right}
.scene[data-state="ar"] .tx .en{opacity:0}
.scene[data-state="en"] .tx .ar{opacity:0}
.scene-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:14px 8px 6px}
.scene-ctl .note{flex:1 1 220px;font-size:.84rem;color:var(--muted);line-height:1.6}
.seg{display:inline-flex;padding:4px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.seg button{border:0;background:transparent;padding:7px 18px;border-radius:999px;font:600 .92rem var(--font-body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--a1);color:var(--on-a)}

/* sections */
.sec{padding-block:clamp(40px,5.5vw,72px);scroll-margin-top:72px}
.sec.alt{background:color-mix(in srgb,var(--a1) 9%,var(--bg2))}
.sec-h{max-width:640px;margin-bottom:34px}
h2{font-family:var(--font-display);font-weight:700;font-size:clamp(1.8rem,3.2vw,2.5rem);line-height:1.18;letter-spacing:-.012em;margin-bottom:10px;text-wrap:balance}
.sec-h p{color:var(--muted)}
.kicker{font-size:.85rem;font-weight:600;letter-spacing:.04em;color:var(--muted);margin-bottom:14px}
.strip{padding-block:6px 20px}
.strip ul{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.strip li{display:flex;flex-direction:column;gap:8px;min-width:0}
.dot-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--a1) 34%,var(--card));border:1px solid color-mix(in srgb,var(--a1) 60%,var(--line))}
.strip h3{font-size:1.02rem;font-weight:600}
.strip p{font-size:.93rem;color:var(--muted);line-height:1.65}
.glyph{font-family:var(--font-display);font-weight:700;font-size:1.4rem;line-height:1}

.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.grid2>*{min-width:0}
.card{position:relative;border:1px solid var(--line);border-radius:22px;padding:26px;
  background:color-mix(in srgb,var(--card) 92%,transparent);transition:transform .25s}
.card:hover{transform:translateY(-3px)}
.card h3{font-size:1.2rem;font-weight:600;margin:16px 0 8px}
.card p{color:var(--muted);font-size:.98rem}
.chip{position:absolute;top:22px;inset-inline-end:22px;display:inline-flex;align-items:center;gap:7px;padding:3px 12px;border-radius:999px;
  font-size:.8rem;font-weight:600;border:1px solid color-mix(in srgb,var(--a1) 60%,var(--line));
  background:color-mix(in srgb,var(--a1) 14%,var(--card))}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dev)}
.chip.ok::before{background:var(--ok)} .chip.beta::before{background:var(--beta)}
.later{margin-top:22px;color:var(--muted);font-size:.95rem}

/* real screenshots */
.shots{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.shots figure{border:1px solid var(--line);border-radius:20px;padding:10px;background:color-mix(in srgb,var(--card) 92%,transparent);box-shadow:var(--shadow);min-width:0}
.shots img{border-radius:12px;width:100%;height:auto}
.shots figcaption{color:var(--muted);font-size:.92rem;padding:12px 6px 4px}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;counter-reset:s;margin-bottom:34px}
.steps li{counter-increment:s;padding:22px;border-radius:20px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 92%,transparent);min-width:0}
.steps li::before{content:counter(s,arabic-indic);display:block;font-family:var(--font-display);font-weight:700;font-size:2.2rem;line-height:1;color:color-mix(in srgb,var(--a1) 80%,var(--fg));margin-bottom:10px}
html[lang="en"] .steps li::before{content:counter(s,decimal)}
.steps h3{font-size:1.1rem;font-weight:600;margin-bottom:6px}
.steps p{color:var(--muted);font-size:.96rem}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:20px;background:var(--card)}
table{width:100%;min-width:620px;border-collapse:collapse}
th,td{padding:15px 18px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line);font-size:.96rem}
tr:last-child td,tr:last-child th{border-bottom:0}
thead th{font-weight:600;background:color-mix(in srgb,var(--a1) 14%,var(--card))}
tbody th{font-weight:500;color:var(--muted);width:17%}
.cmp-note{margin-top:16px;color:var(--muted);font-size:.95rem}

.verify{margin-top:20px;border:1px solid var(--line);border-radius:22px;padding:clamp(20px,3vw,32px);background:color-mix(in srgb,var(--card) 92%,transparent)}
.verify h3{font-size:1.2rem;font-weight:600;margin-bottom:14px}
.verify ol{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding-inline-start:1.3em;list-style:decimal}
.verify li{min-width:0}
.code{display:flex;align-items:center;gap:10px;min-width:0;max-width:100%;margin-top:10px;padding:10px 12px;border-radius:12px;background:#1F1812;color:#F3E9DC;direction:ltr}
.code code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;font:.9rem var(--font-mono)}
.code .ib{background:#33281F;border-color:#4A3B2F;color:#F3E9DC;height:32px;min-width:32px;font-size:.8rem}
.warn{margin-top:16px;padding:12px 16px;border-radius:12px;font-size:.93rem;color:var(--muted);
  border:1px dashed color-mix(in srgb,var(--beta) 65%,var(--line))}

.dl{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,4vw,44px);align-items:center;padding:clamp(22px,4vw,40px);border-radius:28px;
  border:1px solid var(--line);box-shadow:var(--shadow);
  background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 24%,var(--card)),var(--card) 70%)}
.dl>*{min-width:0}
.dl img{width:clamp(96px,16vw,168px);border-radius:28%;box-shadow:var(--shadow)}
.dl dl{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;margin:18px 0 22px;font-size:.96rem}
.dl dt{color:var(--muted)}
.dl dd{min-width:0;overflow-wrap:anywhere}
.sha{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sha code{font:.82rem var(--font-mono);direction:ltr;overflow-wrap:anywhere}
.dl .small{font-size:.9rem;color:var(--muted);margin-top:16px}

.faq{max-width:820px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 4px;font-weight:600;font-size:1.05rem}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:1.5rem;line-height:1;color:var(--muted);transition:transform .25s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 4px 20px;color:var(--muted);max-width:44em}

.foot{border-top:1px solid var(--line);padding-block:36px;color:var(--muted);font-size:.9rem}
.foot .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;align-items:flex-start}
.foot p{max-width:52em}

@media (max-width:980px){
  .hero .wrap{grid-template-columns:1fr}
  .strip ul{grid-template-columns:repeat(2,1fr)}
  .steps{grid-template-columns:1fr}
}
@media (max-width:900px){
  .links{display:none}
  .menu-btn{display:inline-flex}
}
@media (max-width:760px){
  .shots{grid-template-columns:1fr}
}
@media (max-width:700px){
  body{font-size:15.5px;line-height:1.62}
  .brand{font-size:1.25rem}
  .hero{padding-block:22px 30px}
  .eyebrow{font-size:.78rem;padding:5px 12px;gap:7px}
  h1{font-size:1.95rem;line-height:1.16;margin:12px 0 12px}
  .lead{font-size:1rem;line-height:1.6;max-width:none}
  .cta{margin-top:18px!important;gap:10px!important}
  .btn{padding:12px 18px;font-size:.98rem;border-radius:12px}
  .meta{margin-top:12px;font-size:.84rem}
  .scene{padding:8px;border-radius:20px}
  .scene-screen{aspect-ratio:4/3}
  .menu{top:9%;gap:6px;width:52%}
  .menu li{padding:6px 12px}
  .sec{padding-block:38px;scroll-margin-top:64px}
  h2{font-size:1.65rem;line-height:1.2}
  .kicker{margin-bottom:10px}
  .card{padding:20px;border-radius:18px}
  .card h3{font-size:1.1rem;margin:12px 0 6px}
  .steps li{padding:18px}
  .steps li::before{font-size:1.8rem}
  table{min-width:0}
  th,td{padding:12px 10px;font-size:.88rem}
  tbody th{width:20%}
  .verify{padding:20px;border-radius:18px}
  .grid2{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr;padding:22px;border-radius:22px}
  .dl img{width:96px}
  .faq summary{font-size:1rem;padding:15px 4px}
  .top .pal{display:none}
}
@media (max-width:480px){
  .strip ul{grid-template-columns:1fr}
  .btn{width:100%}

(function(){
  var root = document.documentElement;
  var reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){}
  var store = {
    get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  };
  var PALS = ['violet','blue','pink','emerald','rose','amber'];
  var lang = store.get('lang') === 'en' ? 'en' : 'ar';
  var pal = store.get('pal') || 'violet';
  var theme = store.get('theme'); // 'light' | 'dark' | null (follow system)
  if (PALS.indexOf(pal) < 0) pal = 'violet';

  function name(){ return lang === 'ar' ? CFG.nameAr : CFG.nameEn; }
  function t(k){ var s = (T[lang][k] != null ? T[lang][k] : k); return s.replace(/\{name\}/g, name()); }
  function $(id){ return document.getElementById(id); }
  function all(sel){ return Array.prototype.slice.call(document.querySelectorAll(sel)); }

  function isDark(){
    if (root.getAttribute('data-theme') === 'dark') return true;
    if (root.getAttribute('data-theme') === 'light') return false;
    try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch(e){ return false; }
  }

  function renderRelease(){
    var r = CFG.release || {};
    var on = !!(r.url && r.sha256);          // both a real link AND a fingerprint are required
    var hero = $('dlHero'), main = $('dlMain');
    $('dlHeroLbl').textContent = on ? t('hero.cta1') : t('hero.cta1.soon');
    $('dlMainLbl').textContent = on ? t('hero.cta1') : t('hero.cta1.soon');
    if (on){
      hero.setAttribute('href', r.url); hero.setAttribute('target','_blank'); hero.setAttribute('rel','noopener');
      main.setAttribute('href', r.url); main.setAttribute('target','_blank'); main.setAttribute('rel','noopener');
      main.classList.remove('is-off'); main.removeAttribute('aria-disabled'); main.removeAttribute('tabindex');
    } else {
      hero.setAttribute('href','#get'); hero.removeAttribute('target');
      main.removeAttribute('href'); main.classList.add('is-off'); main.setAttribute('aria-disabled','true'); main.setAttribute('tabindex','-1');
    }
    $('verVal').textContent = r.version || t('get.ver.v');
    $('shaVal').textContent = r.sha256 || t('get.sha.none');
    $('copySha').hidden = !r.sha256;
    $('cmdText').textContent = 'Get-FileHash -Algorithm SHA256 .\\' + CFG.fileName;
  }

  function apply(){
    root.lang = lang;
    root.dir = lang === 'ar' ? 'rtl' : 'ltr';
    all('[data-i18n]').forEach(function(el){ el.innerHTML = t(el.getAttribute('data-i18n')); });
    all('[data-i18n-aria]').forEach(function(el){ var v = t(el.getAttribute('data-i18n-aria')); el.setAttribute('aria-label', v); el.setAttribute('title', v); });
    all('[data-i18n-alt]').forEach(function(el){ el.setAttribute('alt', t(el.getAttribute('data-i18n-alt'))); });
    $('brandName').textContent = name();
    document.title = t('doc.title');
    $('langBtn').textContent = lang === 'ar' ? 'EN' : 'عربي';
    $('langBtn').lang = lang === 'ar' ? 'en' : 'ar';
    $('langBtn').setAttribute('aria-label', lang === 'ar' ? 'English' : 'العربية');
    $('copyCmd').setAttribute('aria-label', t('copy')); $('copyCmd').title = t('copy');
    $('copySha').setAttribute('aria-label', t('copy')); $('copySha').title = t('copy');
    root.setAttribute('data-pal', pal);
    all('.pb').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-pal') === pal ? 'true' : 'false'); });
    $('themeUse').setAttribute('href', isDark() ? '#i-sun' : '#i-moon');
    renderRelease();
  }

  /* images */
  $('logo').src = ICON; $('logo2').src = ICON;

  /* controls */
  $('langBtn').addEventListener('click', function(){ lang = lang === 'ar' ? 'en' : 'ar'; store.set('lang', lang); apply(); });
  $('themeBtn').addEventListener('click', function(){
    theme = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', theme); store.set('theme', theme); apply();
  });
  all('.pb').forEach(function(b){ b.addEventListener('click', function(){ pal = b.getAttribute('data-pal'); store.set('pal', pal); apply(); }); });
  if (theme === 'light' || theme === 'dark') root.setAttribute('data-theme', theme);

  /* mobile menu */
  var menuBtn = $('menuBtn'), mob = $('mob');
  function closeMenu(){ mob.hidden = true; menuBtn.setAttribute('aria-expanded','false'); }
  menuBtn.addEventListener('click', function(){ var open = mob.hidden; mob.hidden = !open; menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false'); });

  /* smooth in-page navigation */
  function go(id){
    var el = $(id); if (!el) return false;
    el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    try { history.replaceState(null, '', '#' + id); } catch(e){}
    return true;
  }
  document.addEventListener('click', function(e){
    var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!a) return;
    var id = a.getAttribute('href').slice(1);
    if (id && go(id)) { e.preventDefault(); closeMenu(); }
  });
  window.addEventListener('hashchange', function(){ var id = location.hash.slice(1); if (id) go(id); });

  /* active section in header */
  try {
    var ids = ['features','look','how','safety','get','faq'];
    var links = all('.links a');
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting){ links.forEach(function(l){ l.classList.toggle('on', l.getAttribute('href') === '#' + en.target.id); }); }
      });
    }, { rootMargin: '-35% 0px -60% 0px' });
    ids.forEach(function(id){ var el = $(id); if (el) io.observe(el); });
  } catch(e){}

  /* before / after scene (illustration) */
  var scene = $('scene'), timer = null, userTook = false;
  function setScene(s){
    scene.setAttribute('data-state', s);
    $('segOrig').setAttribute('aria-pressed', s === 'en' ? 'true' : 'false');
    $('segTrans').setAttribute('aria-pressed', s === 'ar' ? 'true' : 'false');
  }
  function stopAuto(){ if (timer){ clearInterval(timer); timer = null; } }
  function startAuto(){
    if (reduce || userTook) return;
    stopAuto();
    timer = setInterval(function(){ setScene(scene.getAttribute('data-state') === 'ar' ? 'en' : 'ar'); }, 4200);
  }
  ['segOrig','segTrans'].forEach(function(id){
    $(id).addEventListener('click', function(){ userTook = true; stopAuto(); setScene($(id).getAttribute('data-s')); });
  });
  scene.addEventListener('mouseenter', stopAuto);
  scene.addEventListener('mouseleave', startAuto);
  scene.addEventListener('focusin', stopAuto);
  startAuto();

  /* copy buttons */
  function flash(btn, msg){
    var old = btn.getAttribute('title');
    btn.setAttribute('title', msg);
    var span = btn.querySelector('.fl'); if (span) span.remove();
    span = document.createElement('span'); span.className = 'fl'; span.textContent = msg; span.style.marginInlineStart = '6px';
    btn.appendChild(span);
    setTimeout(function(){ span.remove(); btn.setAttribute('title', old || ''); }, 1800);
  }
  function selectNode(node){
    try { var r = document.createRange(); r.selectNodeContents(node); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch(e){}
  }
  all('[data-copy]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var node = btn.getAttribute('data-copy') === 'cmd' ? $('cmdText') : $('shaVal');
      var text = node.textContent;
      var done = function(){ flash(btn, t('copied')); };
      var fail = function(){ selectNode(node); flash(btn, t('copyfail')); };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done, fail);
      } else { fail(); }
    });
  });

  apply();
  if (location.hash.length > 1) setTimeout(function(){ go(location.hash.slice(1)); }, 120);
})();
</script>
