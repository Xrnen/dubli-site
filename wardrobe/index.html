<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>خزانتي</title>
<meta name="description" content="صوّر ملابسك وخل التطبيق ينسّق لك أوتفت كل يوم.">
<meta name="theme-color" content="#0F0C1D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="خزانتي">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
@font-face{font-family:'Plex Arabic';src:url('IBMPlexSansArabic-Medium.ttf') format('truetype');font-display:swap}
:root{
  --bg:#0F0C1D;--bg2:#171329;--card:#1F1A36;--card2:#2A2347;--fg:#F4F1FF;--muted:#A49DC4;--line:#332C55;
  --a1:#8B6CFF;--a2:#FF7AB6;--gold:#FFD166;--ok:#3DDC97;--bad:#FF6B6B;
  --r:18px;--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Plex Arabic',-apple-system,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{min-height:100dvh;padding-top:var(--safe-t)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit}
h1,h2,h3{margin:0;font-weight:500}
.hidden{display:none!important}

header.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,transparent);padding:14px 18px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
header.top h1{font-size:26px;letter-spacing:-.3px}
header.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}

main{padding:0 16px calc(110px + var(--safe-b))}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);color:var(--muted);font-size:14px;white-space:nowrap;
  border:1px solid transparent;transition:.15s}
.chip.on{background:var(--fg);color:var(--bg)}
.chip .n{opacity:.6;margin-inline-start:4px;font-size:12px}
.wrapchips{display:flex;flex-wrap:wrap;gap:8px}

/* wardrobe grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--card);padding:0}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .dot{position:absolute;bottom:7px;inset-inline-start:7px;width:16px;height:16px;border-radius:50%;border:2px solid #fff;
  box-shadow:0 1px 4px rgba(0,0,0,.4)}
.tile .fav{position:absolute;top:6px;inset-inline-end:6px;color:var(--gold);font-size:15px;text-shadow:0 1px 3px #000}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-size:56px;margin-bottom:8px}
.empty h3{color:var(--fg);font-size:19px;margin-bottom:6px}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--card);border-radius:16px;padding:12px 14px}
.stat b{font-size:22px;display:block;font-weight:500}
.stat span{font-size:12px;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:16px;font-size:16px;
  background:var(--card2);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;box-shadow:0 10px 30px -12px var(--a1)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:rgba(255,107,107,.14);color:var(--bad)}
.btn svg{width:20px;height:20px}
.row{display:flex;gap:10px}
.row>.btn{flex:1}

/* tab bar */
nav.tabs{position:fixed;inset-inline:12px;bottom:calc(10px + var(--safe-b));z-index:10;display:flex;align-items:center;
  background:rgba(31,26,54,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);
  border-radius:24px;padding:6px}
nav.tabs .t{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;color:var(--muted);font-size:11px;border-radius:18px}
nav.tabs .t svg{width:24px;height:24px}
nav.tabs .t.on{color:var(--fg)}
nav.tabs .add{flex:none;width:58px;height:58px;border-radius:20px;margin:0 6px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 10px 28px -8px var(--a2)}
nav.tabs .add svg{width:28px;height:28px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,3,12,.6);z-index:20;opacity:0;pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:21;background:var(--bg2);border-radius:26px 26px 0 0;max-height:92dvh;
  overflow-y:auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  padding:10px 18px calc(22px + var(--safe-b))}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:20px;margin-bottom:14px}
.field{margin-bottom:16px}
.field>label{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}
.preview{width:100%;aspect-ratio:1;border-radius:20px;overflow:hidden;background:var(--card);margin-bottom:16px;position:relative}
.preview img{width:100%;height:100%;object-fit:contain}
.preview .count{position:absolute;top:10px;inset-inline-start:10px;background:rgba(0,0,0,.55);border-radius:999px;padding:4px 10px;font-size:13px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.15);position:relative}
.sw.on{outline:3px solid var(--fg);outline-offset:2px}
.colorname{font-size:13px;color:var(--muted);margin-inline-start:6px}

/* stylist */
.ctrl{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:14px}
.ctrl .lbl{font-size:13px;color:var(--muted);margin-bottom:8px}
.seg{display:flex;background:var(--bg2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--fg)}
.outfit{background:var(--card);border-radius:24px;padding:14px;margin-bottom:14px;position:relative}
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.piece{position:relative;border-radius:16px;overflow:hidden;background:#fff;aspect-ratio:3/4}
.piece.wide{grid-column:span 2;aspect-ratio:auto;height:260px}
.piece.small{aspect-ratio:1}
.piece img{width:100%;height:100%;object-fit:contain;background:#fff}
.piece .tag{position:absolute;bottom:6px;inset-inline-start:6px;background:rgba(15,12,29,.72);color:#fff;font-size:11px;border-radius:999px;padding:3px 9px}
.piece .lock{position:absolute;top:6px;inset-inline-end:6px;width:32px;height:32px;border-radius:50%;background:rgba(15,12,29,.6);
  color:#fff;display:grid;place-items:center}
.piece .lock svg{width:16px;height:16px}
.piece .lock.on{background:var(--gold);color:#000}
.score{display:flex;align-items:center;gap:10px;margin:14px 2px 4px}
.score .pal{display:flex}
.score .pal i{width:22px;height:22px;border-radius:50%;border:2px solid var(--card);margin-inline-start:-6px}
.score .pal i:first-child{margin-inline-start:0}
.score .val{margin-inline-start:auto;font-size:13px;color:var(--gold)}
.why{font-size:14px;color:var(--muted);line-height:1.7;margin:6px 2px 12px}
.pager{display:flex;justify-content:center;gap:6px;margin:4px 0 12px}
.pager i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.pager i.on{background:var(--fg);width:18px;border-radius:4px}
.weather{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:10px}

/* saved */
.saved{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scard{background:var(--card);border-radius:18px;padding:8px;text-align:start}
.scard .mini{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.scard .mini img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:10px}
.scard .meta{font-size:12px;color:var(--muted);padding:8px 4px 2px;display:flex;justify-content:space-between}

.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translate(-50%,-140%);z-index:40;background:var(--fg);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-size:14px;transition:transform .3s;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.hint{font-size:13px;color:var(--muted);line-height:1.7}
.install{background:linear-gradient(135deg,rgba(139,108,255,.18),rgba(255,122,182,.14));border:1px solid var(--line);border-radius:18px;
  padding:14px;margin-bottom:14px;font-size:14px;line-height:1.8}
.install b{color:var(--gold);font-weight:500}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1 id="title">خزانتي</h1>
    <div class="sub" id="subtitle">كل ملابسك بمكان واحد</div>
  </div>
  <button class="iconbtn" id="settingsBtn" aria-label="الإعدادات">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main>
  <!-- WARDROBE -->
  <section class="view" id="v-closet">
    <div id="installTip" class="install hidden">
      📲 عشان يصير تطبيق على الشاشة الرئيسية: اضغط زر <b>المشاركة</b> تحت في سفاري ثم <b>«إضافة إلى الشاشة الرئيسية»</b>.
    </div>
    <div class="stats" id="stats"></div>
    <div class="chips" id="catFilter"></div>
    <div class="grid" id="grid"></div>
    <div class="empty hidden" id="closetEmpty">
      <div class="big">👕</div>
      <h3>خزانتك فاضية</h3>
      <p class="hint">صوّر قطعة قطعة على خلفية سادة (سرير، أرضية، جدار) عشان يعرف لونها صح.</p>
      <button class="btn primary" style="margin-top:12px" onclick="pickPhotos()">صوّر أول قطعة</button>
    </div>
  </section>

  <!-- STYLIST -->
  <section class="view hidden" id="v-style">
    <div class="ctrl">
      <div class="lbl">وين رايح؟</div>
      <div class="chips" id="occPick" style="padding-bottom:4px"></div>
      <div class="lbl" style="margin-top:8px">الجو</div>
      <div class="seg" id="wxPick"></div>
      <div class="weather" id="wxAuto"></div>
    </div>
    <div id="outfitBox"></div>
  </section>

  <!-- SAVED -->
  <section class="view hidden" id="v-saved">
    <div class="chips" id="savedTabs"></div>
    <div class="saved" id="savedGrid"></div>
    <div class="empty hidden" id="savedEmpty">
      <div class="big">✨</div>
      <h3>ما حفظت أوتفت للحين</h3>
      <p class="hint">من صفحة «نسّقلي» اضغط ♡ على أي أوتفت عجبك.</p>
    </div>
  </section>
</main>

<nav class="tabs">
  <button class="t on" data-v="closet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4a2 2 0 1 1 2 2c-1 0-2 .7-2 2v1"/><path d="M12 9 3 15.5c-.9.6-.4 2 .7 2h16.6c1.1 0 1.6-1.4.7-2L12 9z"/></svg>خزانتي</button>
  <button class="t" data-v="style"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.6L12 15l-1.8-4.4L5.5 9l4.7-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>نسّقلي</button>
  <button class="add" id="addBtn" aria-label="أضف قطعة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
  <button class="t" data-v="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 22l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></svg>المحفوظة</button>
  <button class="t" id="todayTab" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>لبستها</button>
</nav>

<input type="file" id="fileIn" accept="image/*" multiple class="hidden">
<input type="file" id="importIn" accept="application/json,.json" class="hidden">

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================
   خزانتي — wardrobe + outfit stylist. 100% on-device:
   photos and data are stored in IndexedDB, nothing is uploaded.
   ========================================================= */

const CATS = [
  {id:'top',    ar:'فوق',      long:'قطعة علوية (تيشيرت، قميص، بلوزة)', e:'👕'},
  {id:'bottom', ar:'تحت',      long:'قطعة سفلية (بنطلون، جينز، تنورة)', e:'👖'},
  {id:'full',   ar:'قطعة كاملة', long:'قطعة كاملة (فستان، ثوب، عباية، جمبسوت)', e:'👗'},
  {id:'outer',  ar:'جاكيت',    long:'طبقة خارجية (جاكيت، كارديغان، بشت)', e:'🧥'},
  {id:'shoes',  ar:'حذاء',     long:'حذاء', e:'👟'},
  {id:'bag',    ar:'شنطة',     long:'شنطة', e:'👜'},
  {id:'acc',    ar:'إكسسوار',  long:'إكسسوار (ساعة، نظارة، شماغ، طرحة، حزام)', e:'⌚'},
];
const CAT = Object.fromEntries(CATS.map(c=>[c.id,c]));
const OCCS = [
  {id:'casual', ar:'كاجوال', e:'☕'},
  {id:'work',   ar:'دوام/جامعة', e:'💼'},
  {id:'out',    ar:'طلعة/عشاء', e:'🌙'},
  {id:'event',  ar:'مناسبة', e:'🎉'},
  {id:'sport',  ar:'رياضة', e:'🏃'},
];
const WX = [ {id:'hot',ar:'حر',e:'☀️'}, {id:'mild',ar:'معتدل',e:'⛅'}, {id:'cold',ar:'برد',e:'❄️'} ];
const SEASONS = [ {id:'summer',ar:'صيفي'}, {id:'winter',ar:'شتوي'}, {id:'all',ar:'كل الفصول'} ];

// Named palette. n = neutral (goes with almost everything)
const PALETTE = [
  ['#111111','أسود',1],['#F5F5F2','أبيض',1],['#8A8A8A','رمادي',1],['#3A3A3F','فحمي',1],
  ['#F1E6D2','كريمي',1],['#D6C3A3','بيج',1],['#B49A74','خاكي',1],['#6B4A33','بني',1],['#9C6B3F','جملي',1],
  ['#1E2A4A','كحلي',1],['#4A6A8F','جينز',1],['#9CB6D4','سماوي',0],['#2F5BD3','أزرق',0],
  ['#1F7A6B','زيتي مخضر',0],['#556B2F','زيتي',1],['#3E8E4E','أخضر',0],['#A8C99A','نعناعي',0],
  ['#E8D44D','أصفر',0],['#E9A23B','خردلي',0],['#E8742E','برتقالي',0],
  ['#C0392B','أحمر',0],['#7A1F2B','عنابي',0],['#E8A0B4','وردي',0],['#D94C8A','فوشي',0],
  ['#C9B6E4','ليلكي',0],['#6B3FA0','بنفسجي',0],['#C8A27A','ذهبي',0],['#C0C0C8','فضي',1],
];

/* ---------- storage (IndexedDB) ---------- */
const DB = (() => {
  let dbp;
  function open(){
    if (dbp) return dbp;
    dbp = new Promise((res,rej)=>{
      const r = indexedDB.open('khzanti',1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('items',{keyPath:'id'});
        d.createObjectStore('outfits',{keyPath:'id'});
        d.createObjectStore('kv');
      };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function tx(store, mode, fn){
    const d = await open();
    return new Promise((res,rej)=>{
      const t = d.transaction(store, mode), s = t.objectStore(store);
      const out = fn(s);
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
      t.onerror = () => rej(t.error);
    });
  }
  return {
    all: s => tx(s,'readonly',st=>st.getAll()),
    put: (s,v,k) => tx(s,'readwrite',st=>k===undefined?st.put(v):st.put(v,k)),
    del: (s,k) => tx(s,'readwrite',st=>st.delete(k)),
    get: (s,k) => tx(s,'readonly',st=>st.get(k)),
    clear: s => tx(s,'readwrite',st=>st.clear()),
  };
})();

const S = { items:[], outfits:[], view:'closet', cat:'all', occ:'casual', wx:'mild', results:[], idx:0, locks:{}, savedTab:'fav' };

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2000); }
const byId = id => S.items.find(i=>i.id===id);
const daysAgo = ts => ts ? Math.floor((Date.now()-ts)/864e5) : Infinity;

/* ---------- color science ---------- */
function hexToRgb(h){ h=h.replace('#',''); return [0,2,4].map(i=>parseInt(h.substr(i,2),16)); }
function rgbToHex(r,g,b){ return '#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join(''); }
function rgbToHsl(r,g,b){ r/=255;g/=255;b/=255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b); let h=0,s=0; const l=(mx+mn)/2;
  if(mx!==mn){ const d=mx-mn; s=l>.5?d/(2-mx-mn):d/(mx+mn);
    h = mx===r?((g-b)/d+(g<b?6:0)) : mx===g?((b-r)/d+2) : ((r-g)/d+4); h*=60; }
  return [h,s,l]; }
function rgbToLab(r,g,b){
  const f=v=>{v/=255;return v>.04045?Math.pow((v+.055)/1.055,2.4):v/12.92}; r=f(r);g=f(g);b=f(b);
  let x=(r*.4124+g*.3576+b*.1805)/.95047, y=r*.2126+g*.7152+b*.0722, z=(r*.0193+g*.1192+b*.9505)/1.08883;
  const k=v=>v>.008856?Math.cbrt(v):7.787*v+16/116; x=k(x);y=k(y);z=k(z);
  return [116*y-16,500*(x-y),200*(y-z)]; }
const labDist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
const PAL_LAB = PALETTE.map(p=>({hex:p[0],name:p[1],neutral:!!p[2],lab:rgbToLab(...hexToRgb(p[0]))}));
function nameColor(hex){
  const lab=rgbToLab(...hexToRgb(hex)); let best=PAL_LAB[0],bd=1e9;
  for(const p of PAL_LAB){ const d=labDist(lab,p.lab); if(d<bd){bd=d;best=p;} }
  return best;
}
function colorInfo(hex){
  const [h,s,l]=rgbToHsl(...hexToRgb(hex)); const p=nameColor(hex);
  const neutral = p.neutral || s<.14 || l<.13 || l>.92;
  return {hex,h,s,l,name:p.name,neutral};
}

// Detect dominant garment color: estimate background from the border, ignore pixels near it,
// then take the most common color bucket from the center area.
function detectColor(img){
  const N=72, c=document.createElement('canvas'); c.width=c.height=N; const x=c.getContext('2d',{willReadFrequently:true});
  x.drawImage(img,0,0,N,N); const d=x.getImageData(0,0,N,N).data;
  const px=(i,j)=>{const o=(j*N+i)*4;return [d[o],d[o+1],d[o+2]]};
  let br=[0,0,0],bn=0;
  for(let i=0;i<N;i++) for(const j of [0,1,N-2,N-1]){ const p=px(i,j),q=px(j,i); br[0]+=p[0]+q[0];br[1]+=p[1]+q[1];br[2]+=p[2]+q[2];bn+=2; }
  const bg=rgbToLab(br[0]/bn,br[1]/bn,br[2]/bn);
  const buckets=new Map();
  const m=Math.floor(N*.18);
  for(let j=m;j<N-m;j++) for(let i=m;i<N-m;i++){
    const p=px(i,j), lab=rgbToLab(...p); if(labDist(lab,bg)<16) continue;
    // weight the center more
    const w=1.5-Math.hypot(i-N/2,j-N/2)/(N/2);
    const k=(p[0]>>5)+','+(p[1]>>5)+','+(p[2]>>5);
    const b=buckets.get(k)||{n:0,r:0,g:0,b:0}; b.n+=w;b.r+=p[0]*w;b.g+=p[1]*w;b.b+=p[2]*w; buckets.set(k,b);
  }
  let best=null; for(const b of buckets.values()) if(!best||b.n>best.n) best=b;
  if(!best){ const p=px(N>>1,N>>1); return rgbToHex(...p); }
  return rgbToHex(best.r/best.n,best.g/best.n,best.b/best.n);
}

// Pair harmony: returns {score, kind}
function harmony(a,b){
  if(a.neutral && b.neutral){
    const both = a.name===b.name && Math.abs(a.l-b.l)<.08;
    return {s: both?1:2, k:'neutral'};
  }
  if(a.neutral || b.neutral) return {s:2.2,k:'neutral'};
  let d=Math.abs(a.h-b.h); if(d>180) d=360-d;
  const dl=Math.abs(a.l-b.l);
  if(d<18) return {s: dl>.15?2.4:1.4, k:'mono'};
  if(d<50) return {s:1.6,k:'analog'};
  if(d>=150) return {s: (a.s>.6&&b.s>.6&&dl<.12)?.6:1.8, k:'comp'};   // two loud complements = too much
  if(d>=105 && d<=135) return {s:.6,k:'triad'};
  return {s:-1.6,k:'clash'};
}

/* ---------- image intake ---------- */
function loadImage(file){
  return new Promise((res,rej)=>{ const u=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{res(im);}; im.onerror=rej; im.src=u; });
}
function shrink(img,max=900){
  const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
  const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.82);
}
function guessCat(img){ const r=img.naturalHeight/img.naturalWidth; return r>1.55?'full':r<.75?'shoes':'top'; }

function pickPhotos(){ $('fileIn').value=''; $('fileIn').click(); }
$('fileIn').addEventListener('change', async e=>{
  const files=[...e.target.files]; if(!files.length) return;
  const drafts=[];
  for(const f of files){
    try{ const im=await loadImage(f); const hex=detectColor(im);
      drafts.push({id:uid(),img:shrink(im),cat:S.cat!=='all'&&CAT[S.cat]?S.cat:guessCat(im),color:hex,
        seasons:['all'],occs:[],fav:false,wears:0,lastWorn:0,added:Date.now()});
      URL.revokeObjectURL(im.src);
    }catch(err){ console.warn(err); }
  }
  if(drafts.length) editItem(drafts,0,true);
});

/* ---------- stylist engine ---------- */
function fits(it,occ,wx){
  if(it.occs.length && !it.occs.includes(occ)) return false;
  const sea=it.seasons[0]||'all';
  if(wx==='hot' && sea==='winter') return false;
  if(wx==='cold' && sea==='summer' && (it.cat==='outer'||it.cat==='shoes')) return false;
  return true;
}
const pick=a=>a[Math.floor(Math.random()*a.length)];

function scoreOutfit(pieces,occ,wx){
  const core=pieces.filter(p=>['top','bottom','full','outer','shoes'].includes(p.cat));
  const cols=core.map(p=>colorInfo(p.color)); let s=0; const kinds={};
  for(let i=0;i<cols.length;i++) for(let j=i+1;j<cols.length;j++){
    const h=harmony(cols[i],cols[j]); const w=(core[i].cat==='shoes'||core[j].cat==='shoes')?.6:1;
    s+=h.s*w; kinds[h.k]=(kinds[h.k]||0)+1; }
  const loud=new Set(cols.filter(c=>!c.neutral).map(c=>c.name));
  if(loud.size>2) s-=2.5*(loud.size-2);
  if(loud.size===0) s+= (new Set(cols.map(c=>Math.round(c.l*4))).size>1)?.5:-.8; // all-neutral needs contrast
  // top vs bottom contrast
  const t=pieces.find(p=>p.cat==='top'), b=pieces.find(p=>p.cat==='bottom');
  if(t&&b){ const ct=colorInfo(t.color), cb=colorInfo(b.color); if(Math.abs(ct.l-cb.l)<.06 && ct.name!==cb.name) s-=1; }
  for(const p of pieces){
    if(p.fav) s+=.4;
    const d=daysAgo(p.lastWorn); if(d<3) s-=1.6; else if(d<7) s-=.6;
    if(p.occs.includes(occ)) s+=.5;
    const sea=p.seasons[0]; if((wx==='cold'&&sea==='winter')||(wx==='hot'&&sea==='summer')) s+=.3;
  }
  // don't repeat an outfit you already wore lately
  const key=pieces.map(p=>p.id).sort().join('|');
  if(S.outfits.some(o=>o.worn&&o.key===key&&daysAgo(o.date)<10)) s-=3;
  return {s:s+Math.random()*.8, kinds, loud:[...loud]};
}

function explain(r,pieces){
  const k=r.kinds, parts=[];
  if(r.loud.length===0) parts.push('ألوان محايدة هادية — صعب تغلط فيها');
  else if(r.loud.length===1) parts.push(`لون واحد بارز (${r.loud[0]}) والباقي محايد يبرزه`);
  if(k.mono) parts.push('تدرّج من نفس اللون يعطي مظهر مرتب وطويل');
  if(k.analog) parts.push('ألوان متجاورة على عجلة الألوان، متناسقة وناعمة');
  if(k.comp) parts.push('ألوان متكاملة تعطي تباين حلو');
  if(k.clash) parts.push('فيه لونين ممكن يتعاركون شوي — جرّبه إذا تحب الجرأة');
  const outer=pieces.find(p=>p.cat==='outer'); if(outer) parts.push('أضفت طبقة خارجية عشان الجو');
  const fresh=pieces.filter(p=>!p.wears).length; if(fresh) parts.push(fresh===1?'فيه قطعة ما لبستها قبل!':`فيه ${fresh} قطع ما لبستها قبل!`);
  return parts.slice(0,3).join('. ')+'.';
}

function generate(){
  const {occ,wx}=S; const pool=c=>S.items.filter(i=>i.cat===c&&fits(i,occ,wx));
  const P={top:pool('top'),bottom:pool('bottom'),full:pool('full'),outer:pool('outer'),shoes:pool('shoes'),bag:pool('bag'),acc:pool('acc')};
  const locked=Object.fromEntries(Object.entries(S.locks).map(([c,id])=>[c,byId(id)]).filter(([,v])=>v));
  const canSplit=(locked.top||P.top.length)&&(locked.bottom||P.bottom.length);
  const canFull=locked.full||P.full.length;
  if(!canSplit && !canFull) return null;
  const seen=new Map();
  for(let n=0;n<500;n++){
    let useFull = locked.full ? true : (locked.top||locked.bottom) ? false
      : canFull && (!canSplit || Math.random()<P.full.length/(P.full.length+Math.min(P.top.length,P.bottom.length)+1));
    if(useFull && !canFull) useFull=false; if(!useFull && !canSplit) useFull=true;
    const ps=[];
    if(useFull) ps.push(locked.full||pick(P.full));
    else { ps.push(locked.top||pick(P.top)); ps.push(locked.bottom||pick(P.bottom)); }
    const wantOuter = locked.outer || (P.outer.length && (wx==='cold' || (wx==='mild'&&Math.random()<.4)));
    if(wantOuter) ps.push(locked.outer||pick(P.outer));
    if(locked.shoes||P.shoes.length) ps.push(locked.shoes||pick(P.shoes));
    if(locked.bag||(P.bag.length&&Math.random()<.7)) ps.push(locked.bag||pick(P.bag));
    if(locked.acc||(P.acc.length&&Math.random()<.6)) ps.push(locked.acc||pick(P.acc));
    const key=ps.map(p=>p.id).sort().join('|'); if(seen.has(key)) continue;
    const r=scoreOutfit(ps,occ,wx); seen.set(key,{pieces:ps,key,...r});
  }
  // keep the best, but make results different from each other
  const sorted=[...seen.values()].sort((a,b)=>b.s-a.s), out=[];
  for(const o of sorted){
    if(out.length>=6) break;
    if(out.some(x=>x.pieces.filter(p=>o.pieces.some(q=>q.id===p.id)&&p.cat!=='shoes').length>=2 && out.length<sorted.length/3)) continue;
    out.push(o);
  }
  return out.length?out:sorted.slice(0,6);
}

const ORDER=['outer','top','full','bottom','shoes','bag','acc'];
function renderStyle(){

  const box=$('outfitBox');
  const tops=S.items.filter(i=>i.cat==='top').length, bots=S.items.filter(i=>i.cat==='bottom').length, full=S.items.filter(i=>i.cat==='full').length;
  if(!(tops&&bots)&&!full){
    box.innerHTML=`<div class="empty"><div class="big">🪄</div><h3>أحتاج قطع أكثر</h3>
      <p class="hint">صوّر على الأقل قطعة <b>فوق</b> وقطعة <b>تحت</b> (أو <b>قطعة كاملة</b> مثل فستان/ثوب)، ويفضل حذاء بعد.</p>
      <button class="btn primary" style="margin-top:12px" onclick="pickPhotos()">صوّر قطعة</button></div>`; return;
  }
  if(!S.results.length){ S.results=generate()||[]; S.idx=0; }
  const o=S.results[S.idx];
  if(!o){ box.innerHTML=`<div class="empty"><div class="big">🤔</div><h3>ما لقيت تركيبة تناسب</h3>
    <p class="hint">جرّب مناسبة أو جو ثاني، أو فك القفل عن بعض القطع.</p></div>`; return; }
  const ps=[...o.pieces].sort((a,b)=>ORDER.indexOf(a.cat)-ORDER.indexOf(b.cat));
  const main=ps.filter(p=>['outer','top','full','bottom'].includes(p.cat)), extra=ps.filter(p=>!main.includes(p));
  const cell=(p,cls='')=>`<div class="piece ${cls}"><img src="${p.img}" alt="">
    <span class="tag">${CAT[p.cat].ar} · ${esc(colorInfo(p.color).name)}</span>
    <button class="lock ${S.locks[p.cat]===p.id?'on':''}" data-lock="${p.cat}" data-id="${p.id}" aria-label="ثبّت">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 ${S.locks[p.cat]===p.id?'8 0v4':'7.5-1.5'}"/></svg></button></div>`;
  const isSaved=S.outfits.some(x=>x.key===o.key&&x.fav);
  box.innerHTML=`<div class="outfit">
      <div class="board">${main.map(p=>cell(p,main.length===1?'wide':'')).join('')}${extra.map(p=>cell(p,'small')).join('')}</div>
      <div class="score"><div class="pal">${ps.map(p=>`<i style="background:${p.color}"></i>`).join('')}</div>
        <span class="val">${'★'.repeat(Math.max(1,Math.min(5,Math.round(o.s/2.2))))}</span></div>
      <p class="why">${explain(o,ps)}</p>
      <div class="pager">${S.results.map((_,i)=>`<i class="${i===S.idx?'on':''}"></i>`).join('')}</div>
      <div class="row">
        <button class="btn ghost" id="favO" style="flex:none;width:56px">${isSaved?'♥':'♡'}</button>
        <button class="btn" id="nextO">🔀 غيره</button>
        <button class="btn primary" id="wearO">بلبسه اليوم</button>
      </div>
    </div>
    <p class="hint" style="text-align:center">🔒 ثبّت أي قطعة وبنسّق الباقي عليها</p>`;
}

    const now=Date.now();
    for(const p of o.pieces){ p.wears=(p.wears||0)+1; p.lastWorn=now; await DB.put('items',p); }
    const ex=S.outfits.find(x=>x.key===o.key);
    const rec=ex&&!ex.worn ? Object.assign(ex,{worn:true,date:now})
      : {id:uid(),key:o.key,ids:o.pieces.map(p=>p.id),occ:S.occ,date:now,fav:!!(ex&&ex.fav),worn:true};
    if(!S.outfits.includes(rec)) S.outfits.push(rec); await DB.put('outfits',rec);
    S.locks={}; S.results=[]; toast('تم ✓ تشكيلة حلوة! سجلتها بـ«لبستها»'); renderStyle(); }
};

/* auto weather guess from the month (Gulf climate) */
function autoWx(){ const m=new Date().getMonth()+1; return [12,1,2].includes(m)?'cold':[3,4,10,11].includes(m)?'mild':'hot'; }

/* ---------- saved / history ---------- */
function renderSaved(){
  const tabs=[{id:'fav',ar:'♥ المفضلة'},{id:'worn',ar:'📅 لبستها'}];
  $('savedTabs').innerHTML=tabs.map(t=>`<button class="chip ${S.savedTab===t.id?'on':''}" data-v="${t.id}">${t.ar}</button>`).join('');
  const list=S.outfits.filter(o=>S.savedTab==='fav'?o.fav:o.worn).sort((a,b)=>b.date-a.date)
    .map(o=>({...o,pieces:o.ids.map(byId).filter(Boolean)})).filter(o=>o.pieces.length>=2);
  $('savedEmpty').classList.toggle('hidden',list.length>0);
  $('savedEmpty').querySelector('h3').textContent=S.savedTab==='fav'?'ما حفظت أوتفت للحين':'ما سجلت شي لبسته للحين';
  $('savedGrid').innerHTML=list.map(o=>{
    const ps=[...o.pieces].sort((a,b)=>ORDER.indexOf(a.cat)-ORDER.indexOf(b.cat)).slice(0,4);
    const occ=OCCS.find(x=>x.id===o.occ);
    return `<button class="scard" data-id="${o.id}"><div class="mini">${ps.map(p=>`<img src="${p.img}" alt="">`).join('')}</div>
      <div class="meta"><span>${occ?occ.e+' '+occ.ar:''}</span><span>${new Date(o.date).toLocaleDateString('ar',{day:'numeric',month:'short'})}</span></div></button>`;
  }).join('');
}
$('savedTabs').onclick=e=>{const b=e.target.closest('[data-v]'); if(!b)return; S.savedTab=b.dataset.v; markTab(); renderSaved();};
$('savedGrid').onclick=e=>{const b=e.target.closest('[data-id]'); if(!b)return; const o=S.outfits.find(x=>x.id===b.dataset.id);
  const ps=o.ids.map(byId).filter(Boolean).sort((a,b)=>ORDER.indexOf(a.cat)-ORDER.indexOf(b.cat));
  openSheet(`<h2>أوتفت</h2><div class="board" style="margin-bottom:16px">${ps.map(p=>`<div class="piece"><img src="${p.img}" alt=""><span class="tag">${CAT[p.cat].ar}</span></div>`).join('')}</div>
    <div class="row"><button class="btn danger" id="oDel">حذف</button><button class="btn primary" id="oWear">بلبسه مرة ثانية</button></div>`);
  $('oDel').onclick=async()=>{ await DB.del('outfits',o.id); S.outfits=S.outfits.filter(x=>x!==o); closeSheet(); renderSaved(); };
  $('oWear').onclick=()=>{ S.locks={}; ps.forEach(p=>S.locks[p.cat]=p.id); S.results=[]; closeSheet(); go('style'); };
};

/* ---------- settings / backup ---------- */
$('settingsBtn').onclick=()=>{
  openSheet(`<h2>الإعدادات</h2>
    <p class="hint">كل صورك وبياناتك محفوظة <b>على جوالك بس</b> — ما ترفع لأي مكان. إذا مسحت بيانات سفاري أو حذفت التطبيق تروح، فخذ نسخة احتياطية كل فترة.</p>
    <div style="display:grid;gap:10px;margin-top:16px">
      <button class="btn" id="bExp">⬇️ تصدير نسخة احتياطية</button>
      <button class="btn" id="bImp">⬆️ استرجاع نسخة احتياطية</button>
      <button class="btn danger" id="bWipe">🗑️ مسح كل شي</button>
    </div>
    <p class="hint" style="margin-top:18px">💡 نصايح للتصوير: حط القطعة مفرودة على خلفية سادة، بإضاءة النهار، وصورها من فوق. كذا يعرف اللون صح والأوتفتات تطلع أحلى.</p>`);
  $('bExp').onclick=async()=>{
    const data=JSON.stringify({app:'khzanti',v:1,items:S.items,outfits:S.outfits});
    const file=new File([data],`khzanti-backup-${new Date().toISOString().slice(0,10)}.json`,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:'نسخة خزانتي'}); return; }catch(e){ if(e.name==='AbortError') return; } }
    const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=file.name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  };
  $('bImp').onclick=()=>{ $('importIn').value=''; $('importIn').click(); };
  $('bWipe').onclick=async()=>{ if(!confirm('بتنمسح كل القطع والأوتفتات. متأكد؟')) return;
    await DB.clear('items'); await DB.clear('outfits'); S.items=[]; S.outfits=[]; S.results=[]; S.locks={}; closeSheet(); render(); toast('انمسح كل شي'); };
};
$('importIn').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ const d=JSON.parse(await f.text()); if(d.app!=='khzanti') throw 0;
    for(const it of d.items||[]) await DB.put('items',it);
    for(const o of d.outfits||[]) await DB.put('outfits',o);
    await load(); closeSheet(); render(); toast(`رجعت ${d.items.length} قطعة ✓`);
  }catch(err){ toast('الملف مو نسخة من خزانتي'); }
});

/* ---------- navigation ---------- */
const TITLES={closet:['خزانتي','كل ملابسك بمكان واحد'],style:['نسّقلي','أوتفت مقترح لك اليوم'],saved:['المحفوظة','أوتفتاتك المفضلة واللي لبستها']};
function go(v){
  if(v==='today'){ S.savedTab='worn'; v='saved'; } else if(v==='saved' && S.view!=='saved') S.savedTab='fav';
  S.view=v;
  ['closet','style','saved'].forEach(x=>$('v-'+x).classList.toggle('hidden',x!==v));
  markTab();
  $('title').textContent=TITLES[v][0]; $('subtitle').textContent=TITLES[v][1];
  render(); window.scrollTo(0,0);
}
document.querySelectorAll('nav .t').forEach(t=>t.onclick=()=>go(t.dataset.v));
$('addBtn').onclick=pickPhotos;
function markTab(){ const a=S.view==='saved'&&S.savedTab==='worn'?'today':S.view;
  document.querySelectorAll('nav .t').forEach(t=>t.classList.toggle('on',t.dataset.v===a)); }
function render(){ if(S.view==='closet') renderCloset(); else if(S.view==='style') renderStyle(); else renderSaved(); }

async function load(){
  S.items=(await DB.all('items')).map(i=>({seasons:['all'],occs:[],...i}));
  S.outfits=await DB.all('outfits');
}

(async function init(){
  S.wx=autoWx();
  const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent), standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  if(isIOS&&!standalone) $('installTip').classList.remove('hidden');
  $('wxAuto').textContent='🌡️ اخترت الجو تلقائياً حسب الشهر — غيّره إذا تبي';
  try{ await load(); }catch(e){ toast('ما قدرت أفتح التخزين'); }
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  render();
  if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
